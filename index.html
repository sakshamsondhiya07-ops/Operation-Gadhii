<!DOCTYPE html>

<head>

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;

<body>

  <canvas id="heartCanvas"></canvas>

  <div id="name-container">
    <h1>Tamanna</h1>
    <p>Happy Birthday! ✨</p>
  </div>

  <div class="hint">Tap anywhere on screen ❤️</div>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const nameContainer = document.getElementById('name-container');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Particle logic
    const particles = [];
    const particleCount = 600;
    let isBroken = false;

    // Heart formula
    function heartPosition(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      return { x, y };
    }

    class Particle {
      constructor() {
        this.t = Math.random() * Math.PI * 2;
        const pos = heartPosition(this.t);
        
        // Scale factor for responsiveness
        const scale = Math.min(width, height) / 45;
        this.baseX = width / 2 + pos.x * scale;
        this.baseY = height / 2 + pos.y * scale;
        
        this.x = this.baseX;
        this.y = this.baseY;
        
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        
        this.size = Math.random() * 2.5 + 1;
        this.color = `rgba(255, ${Math.floor(Math.random() * 80)}, ${Math.floor(Math.random() * 120 + 80)}, ${Math.random() * 0.7 + 0.3})`;
        
        // Pulse offset
        this.pulseSpeed = Math.random() * 0.05 + 0.02;
      }

      update(time) {
        if (!isBroken) {
          // Heart heartbeat effect
          const scale = 1 + Math.sin(time * 3) * 0.05;
          const pos = heartPosition(this.t);
          const currentScale = (Math.min(width, height) / 45) * scale;
          
          this.x = width / 2 + pos.x * currentScale + (Math.random() - 0.5) * 4;
          this.y = height / 2 + pos.y * currentScale + (Math.random() - 0.5) * 4;
        } else {
          // Break/explosion effect
          this.x += this.vx * 4;
          this.y += this.vy * 4;
          this.size *= 0.98; // Gradual fade out
        }
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Initialize particles
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    let startTime = Date.now();

    function animate() {
      // Trail effect
      ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
      ctx.fillRect(0, 0, width, height);

      const time = (Date.now() - startTime) / 1000;

      particles.forEach(p => {
        p.update(time);
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();

    // Trigger animation on click/tap
    window.addEventListener('click', () => {
      if (!isBroken) {
        isBroken = true;
        nameContainer.classList.add('show');
        document.querySelector('.hint').style.display = 'none';
      }
    });
  </script>
